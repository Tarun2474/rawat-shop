<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a0000" />
    </linearGradient>

    <!-- Glowing Red Gradient for 'R' -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#cc0000" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#ff1a1a" stroke-width="12" />

  <!-- Outer Red Glow Effect -->
  <text x="50%" y="68%" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="340" fill="#ff1a1a" filter="url(#glow)" opacity="0.6">R</text>

  <!-- Main Bold Letter 'R' for RAWAT SHOP -->
  <text x="50%" y="68%" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="340" fill="url(#redGrad)">R</text>
</svg>